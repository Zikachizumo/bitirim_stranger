<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitirim Interaction</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/indicator.css" />
    <link rel="stylesheet" href="css/radial.css" />
    <link rel="stylesheet" href="css/passport.css" />
</head>
<body>
    <!-- World-anchored floating indicators (screen space, fed every frame). -->
    <div id="indicator-layer"></div>

    <!-- Radial interaction menu (focus modal). -->
    <div id="radial-root" class="bx-hidden">
        <div id="radial-blur"></div>
        <div id="radial-ring">
            <div id="radial-center">
                <span id="radial-center-label">Player Interaction</span>
            </div>
            <div id="radial-items"></div>
        </div>
        <div id="radial-hint">ESC to close</div>
    </div>

    <!-- Incoming passport request prompt (focus-less, premium notification). -->
    <div id="passport-prompt" class="bx-hidden"></div>

    <!-- Passport document (focus modal, shown after acceptance). -->
    <div id="passport-modal" class="bx-hidden"></div>

    <script src="js/bridge.js"></script>
    <script src="js/indicator.js"></script>
    <script src="js/radial.js"></script>
    <script src="js/passport.js"></script>
</body>
</html>
